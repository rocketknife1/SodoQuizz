<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Ghicește ce se ascunde în poza neclară. 14 categorii și multiplayer live.">

  <!-- Esential pentru randare corecta pe mobil - fara acest tag, browserul
       poate alege o latime "virtuala" implicita (de obicei ~980px) si scala
       diferit in functie de motor/versiune, ceea ce facea ca acelasi site sa
       arate la dimensiuni diferite pe telefoane diferite (chiar acelasi
       model). viewport-fit=cover ajuta si la notch-ul de pe iPhone. -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="SodoQuizz">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>SodoQuizz</title>
  <link rel="manifest" href="manifest.json">

  <style>
    html, body {
      height: 100%;
      margin: 0;
      padding: 0;
      background: #0B1229;
      overflow: hidden;
    }

    /* Incadreaza jocul intr-un cadru cu proportii de telefon, centrat -
       indiferent cat de lata/inalta e fereastra de browser (sau fullscreen),
       jocul ramane la aspectul unui ecran de telefon, nu se intinde urat
       pe tot ecranul desktop. */
    #phone-frame {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #0B1229;
    }

    #flutter-host {
      position: relative;
      height: 100%;
      width: 100%;
      /* 100vh ca fallback pentru browsere vechi; 100dvh (dynamic viewport
         height) e mai corect pe mobil, unde bara de adresa a browserului
         apare/dispare si schimba inaltimea reala vizibila. */
      max-height: 100vh;
      max-height: 100dvh;
      max-width: min(100vw, calc(100vh * 9 / 19.5));
      max-width: min(100vw, calc(100dvh * 9 / 19.5));
      aspect-ratio: 9 / 19.5;
      overflow: hidden;
      box-shadow: 0 0 60px rgba(0, 0, 0, 0.55);
    }
  </style>
</head>
<body>
  <div id="phone-frame">
    <div id="flutter-host"></div>
  </div>

  <script>
    // Curata orice service worker/cache instalat de un build vechi (deploy-uri
    // anterioare foloseau service worker si utilizatorii care revin puteau
    // ramane blocati pe continut vechi cache-uit local pana la un refresh
    // fortat). Noile build-uri nu mai inregistreaza service worker deloc.
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.getRegistrations().then((regs) => {
        for (const reg of regs) reg.unregister();
      });
    }
    if (window.caches) {
      caches.keys().then((keys) => keys.forEach((key) => caches.delete(key)));
    }
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
