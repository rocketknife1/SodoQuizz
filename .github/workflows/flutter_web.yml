name: Deploy Flutter Web to GitHub Pages

on:
  push:
    branches:
      - main
  # redeploy manual, fara commit gol — ex. dupa ce se schimba un secret de
  # repo (APPCHECK_RECAPTCHA_KEY): `gh workflow run flutter_web.yml`
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Install dependencies
        run: flutter pub get

      - name: Enable GitHub Pages
        uses: actions/configure-pages@v5

      - name: Build Flutter Web
        # APPCHECK_RECAPTCHA_KEY: cheia de site reCAPTCHA Enterprise din
        # Firebase Console -> App Check -> aplicatia web (inregistrata
        # 2026-09-02). NU e secreta (ajunge oricum in pagina servita), dar
        # sta ca secret de repo ca sa nu fie in git. Cat timp secretul
        # lipseste, `--dart-define` primeste string gol si activateAppCheck()
        # iese curat pe web (vezi app_check_service.dart) — deci pasul asta e
        # inofensiv pana cand cheia e adaugata.
        run: flutter build web --release --base-href /SodoQuizz/ --dart-define=APPCHECK_RECAPTCHA_KEY=${{ secrets.APPCHECK_RECAPTCHA_KEY }}

      - name: Copy static pages (privacy policy etc.)
        run: cp web/privacy-policy.html build/web/privacy-policy.html

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy:
    needs: build
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    permissions:
      pages: write
      id-token: write

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4