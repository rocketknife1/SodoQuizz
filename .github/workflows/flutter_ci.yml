name: Flutter CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  analyze-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Install dependencies
        run: flutter pub get

      - name: Run analyzer
        run: flutter analyze

      # Toate testele din test/, nu doar widget_test.dart — pana pe 2026-09-10
      # CI-ul rula exact fisierul din commit-ul initial, iar celelalte 50
      # (logica de joc, economie, power-up-uri, tancuri...) nu rulau niciodata.
      - name: Run all tests
        run: flutter test
