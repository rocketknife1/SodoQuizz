name: guess_it
description: "Ghicește ce se ascunde în poza neclară. 15 categorii, 6 moduri multiplayer, provocări zilnice."
publish_to: 'none'

version: 1.0.1+6

environment:
  sdk: ^3.6.2

dependencies:
  flame: ^1.30.1
  flutter:
    sdk: flutter
  shared_preferences: ^2.3.0
  audioplayers: ^6.1.0
  url_launcher: ^6.3.1
  app_links: ^6.3.2
  share_plus: ^10.1.2
  firebase_core: ^4.12.1
  cloud_firestore: ^6.7.1
  firebase_auth: ^6.5.6
  # COBORÂT de la ^7.1.1 pe 2026-09-11: v7 trece pe Android prin ecranul
  # nou "Credential Manager" al sistemului, si EXACT acolo se produce
  # ecranul negru (fereastra externa GoogleSignInActivity, confirmat in
  # logcat) — bug de driver Vulkan/Impeller pe placa Samsung Xclipse.
  # 6.2.1 foloseste SDK-ul vechi de Google, alta fereastra, alt cod — nu
  # mai declanseaza bug-ul. Verificat: Play Games (alt flux) NU dadea
  # ecran negru, deci problema era STRICT in fereastra asta, nu generala.
  google_sign_in: 6.2.1
  google_sign_in_web: 0.12.4+4
  http: ^1.6.0
  google_mobile_ads: ^5.3.1
  firebase_auth_games_services: ^3.0.1
  firebase_app_check: ^0.4.6
  firebase_messaging: ^16.0.4
  flutter_local_notifications: ^18.0.1
  timezone: ^0.9.4
  flutter_timezone: ^3.0.1
  firebase_crashlytics: ^5.3.0
  firebase_analytics: ^12.5.0
  package_info_plus: ^9.0.1
  firebase_remote_config: ^6.6.0
  in_app_review: ^2.0.12
  in_app_purchase: ^3.3.0
  cloud_functions: ^6.4.0
  crypto: ^3.0.7
  in_app_purchase_android: ^0.5.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.3
  fake_cloud_firestore: ^4.2.0

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon/icon.png"
  min_sdk_android: 23

flutter:
  uses-material-design: true
  assets:
    - assets/branding/
    # Matematica nu are folder `poze/`: intrebarile ei arata formule, nu
    # imagini. Se adauga cand apar primele intrebari cu matematicieni.
    - assets/continut/matematica/
    - assets/continut/cartoon/
    - assets/continut/cartoon/poze/
    - assets/continut/logouri/
    - assets/continut/logouri/poze/
    - assets/continut/jocuri/
    - assets/continut/jocuri/poze/
    - assets/continut/medical/
    - assets/continut/medical/poze/
    - assets/continut/mecanica/
    - assets/continut/mecanica/poze/
    - assets/continut/aplicatii/
    - assets/continut/aplicatii/poze/
    - assets/continut/masini/
    - assets/continut/masini/poze/
    - assets/continut/celebritati/
    - assets/continut/celebritati/poze/
    - assets/continut/sport/
    - assets/continut/sport/poze/
    - assets/continut/romania/
    - assets/continut/romania/poze/
    - assets/continut/steaguri/
    - assets/continut/steaguri/poze/
    - assets/continut/animale/
    - assets/continut/animale/poze/
    - assets/continut/monumente/
    - assets/continut/monumente/poze/
    - assets/continut/instrumente/
    - assets/continut/instrumente/poze/
    - assets/sfx/
    - assets/music/