plugins {
    id "com.android.application"
    id "kotlin-android"
    // The Flutter Gradle Plugin must be applied after the Android and Kotlin Gradle plugins.
    id "dev.flutter.flutter-gradle-plugin"
    id "com.google.gms.google-services"
}

def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file("key.properties")
def hasKeystore = keystorePropertiesFile.exists()
if (hasKeystore) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

android {
    namespace = "com.example.guess_it"
    // Fixat pe 36 (Android 16), nu flutter.compileSdkVersion: SDK-ul Flutter
    // instalat (3.27.4) inca da 35, iar Google Play cere targetSdk 36 pana la
    // 31 august 2026, altfel nu se mai pot publica update-uri. Se compileaza
    // cu 36 pentru ca targetSdk n-are voie sa fie peste compileSdk.
    // De sters cand Flutter urca singur la 36 - pana atunci raman explicite.
    compileSdk = 36
    ndkVersion = flutter.ndkVersion

    compileOptions {
        // Cerut de flutter_local_notifications: pluginul foloseste API-uri de
        // data/ora din Java 8 (java.time) care nu exista pe Android vechi, iar
        // desugaring-ul le rescrie ca sa mearga si acolo. Fara el, build-ul de
        // release pica la `checkReleaseAarMetadata` cu un mesaj explicit.
        coreLibraryDesugaringEnabled = true
        sourceCompatibility = JavaVersion.VERSION_1_8
        targetCompatibility = JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_1_8
    }

    defaultConfig {
        applicationId = "com.dragosssx.guessit"
        // You can update the following values to match your application needs.
        // For more information, see: https://flutter.dev/to/review-gradle-config.
        // Firebase (cloud_firestore/firebase_auth) cere minim API 23 - flutter.minSdkVersion
        // (21) e prea jos si sparge manifest merge-ul, indiferent daca Firebase e configurat.
        // Urcat la 24 (Android 7.0) pentru play-services-games-v2, cerut de
        // firebase_auth_games_services (login prin Play Games) - la 23 pica direct
        // manifest merge-ul. Android 6.0 nu mai apare deloc in statisticile de
        // distributie in 2026, deci nu pierdem jucatori reali.
        minSdk = 24
        // Vezi compileSdk de mai sus. Urcarea la 36 aduce doua schimbari de
        // comportament pe Android 16, ambele deja acoperite:
        //  - edge-to-edge obligatoriu, fara opt-out (aplicatia deseneaza sub
        //    bara de status si cea de navigare) - ecranele folosesc SafeArea;
        //  - predictive back pornit implicit - manifestul are deja
        //    enableOnBackInvokedCallback si codul foloseste PopScope.
        targetSdk = 36
        versionCode = flutter.versionCode
        versionName = flutter.versionName
    }

    signingConfigs {
        if (hasKeystore) {
            release {
                keyAlias keystoreProperties["keyAlias"]
                keyPassword keystoreProperties["keyPassword"]
                storeFile file(keystoreProperties["storeFile"])
                storePassword keystoreProperties["storePassword"]
            }
        }
    }

    buildTypes {
        release {
            // Foloseste keystore-ul de upload daca android/key.properties exista
            // (vezi android/app/upload-keystore.jks, generat local, negitat).
            // Altfel cade pe cheia de debug, ca `flutter run --release` sa
            // mearga si fara el (ex. checkout nou, fara keystore-ul original).
            signingConfig = hasKeystore ? signingConfigs.release : signingConfigs.debug

            // Flutter porneste R8 oricum la --release; fara fisierul asta,
            // regulile noastre nu erau incarcate deloc si notificarile
            // programate crapau tacut in release (vezi proguard-rules.pro
            // pentru bug-ul exact).
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"),
                          "proguard-rules.pro"
        }
    }
}

flutter {
    source = "../.."
}

dependencies {
    // Perechea lui coreLibraryDesugaringEnabled de mai sus — biblioteca in
    // care se rescriu API-urile Java 8.
    coreLibraryDesugaring "com.android.tools:desugar_jdk_libs:2.1.4"
}
