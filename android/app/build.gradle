plugins {
    id "com.android.application"
    id "kotlin-android"
    // The Flutter Gradle Plugin must be applied after the Android and Kotlin Gradle plugins.
    id "dev.flutter.flutter-gradle-plugin"
    id "com.google.gms.google-services"
}

def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file("key.properties")
def hasKeystore = keystorePropertiesFile.exists()
if (hasKeystore) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

android {
    namespace = "com.example.guess_it"
    compileSdk = flutter.compileSdkVersion
    ndkVersion = flutter.ndkVersion

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_1_8
        targetCompatibility = JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_1_8
    }

    defaultConfig {
        applicationId = "com.dragosssx.guessit"
        // You can update the following values to match your application needs.
        // For more information, see: https://flutter.dev/to/review-gradle-config.
        // Firebase (cloud_firestore/firebase_auth) cere minim API 23 - flutter.minSdkVersion
        // (21) e prea jos si sparge manifest merge-ul, indiferent daca Firebase e configurat.
        // Urcat la 24 (Android 7.0) pentru play-services-games-v2, cerut de
        // firebase_auth_games_services (login prin Play Games) - la 23 pica direct
        // manifest merge-ul. Android 6.0 nu mai apare deloc in statisticile de
        // distributie in 2026, deci nu pierdem jucatori reali.
        minSdk = 24
        targetSdk = flutter.targetSdkVersion
        versionCode = flutter.versionCode
        versionName = flutter.versionName
    }

    signingConfigs {
        if (hasKeystore) {
            release {
                keyAlias keystoreProperties["keyAlias"]
                keyPassword keystoreProperties["keyPassword"]
                storeFile file(keystoreProperties["storeFile"])
                storePassword keystoreProperties["storePassword"]
            }
        }
    }

    buildTypes {
        release {
            // Foloseste keystore-ul de upload daca android/key.properties exista
            // (vezi android/app/upload-keystore.jks, generat local, negitat).
            // Altfel cade pe cheia de debug, ca `flutter run --release` sa
            // mearga si fara el (ex. checkout nou, fara keystore-ul original).
            signingConfig = hasKeystore ? signingConfigs.release : signingConfigs.debug
        }
    }
}

flutter {
    source = "../.."
}
